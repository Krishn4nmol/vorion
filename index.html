<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>VØRIØN</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="menu">
      <div class="panel">
        <h1>V<span class="o">Ø</span>RI<span class="o">Ø</span>N</h1>
        <p id="menu-title" class="paused-label"></p>
        <p class="tag">
          Tactical top-down squad shooter.<br />
          Lead your fireteam. Clear the compound.
        </p>

        <div class="field">
          <label for="scale">SCALE</label>
          <select id="scale">
            <option value="skirmish">SKIRMISH — 4v4, tight compound</option>
            <option value="battle">BATTLE — 6v6, large map</option>
          </select>
        </div>

        <div class="field">
          <label for="weapon">LOADOUT</label>
          <select id="weapon">
            <option value="rifle">RIFLE — balanced</option>
            <option value="smg">SMG — fast, short range</option>
            <option value="shotgun">SHOTGUN — brutal up close</option>
            <option value="marksman">MARKSMAN — one shot, long reach</option>
          </select>
        </div>

        <div class="field">
          <label for="volume">VOLUME</label>
          <input id="volume" type="range" min="0" max="100" value="90" />
        </div>

        <button id="start">PLAY</button>
        <button id="restart" class="secondary">NEW MATCH WITH THESE SETTINGS</button>

        <div class="controls">
          <div><b>WASD</b> move</div>
          <div><b>MOUSE</b> aim</div>
          <div><b>HOLD LMB</b> fire</div>
          <div><b>R</b> reload / restart</div>
          <div><b>RMB</b> squad move / attack</div>
          <div><b>F</b> squad flank</div>
          <div><b>G</b> squad regroup</div>
          <div><b>H</b> squad hold</div>
          <div><b>C</b> toggle commander</div>
          <div><b>O</b> order overlay</div>
          <div><b>N</b> minimap</div>
          <div><b>M</b> mute</div>
          <div><b>ESC</b> pause</div>
          <div><b>Q</b> throw grenade</div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
